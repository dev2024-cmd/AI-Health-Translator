name: AI Health Report Translator CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend API & Pipeline Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Run Pytest Suite with Coverage
        run: |
          pytest -v services/api/tests --cov=services/api/app

  frontend-and-shared:
    name: Frontend, Mobile & Shared Tests (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run Shared Package Unit Tests
        run: node packages/shared/test/shared.test.mjs

      - name: Build Web Application (Vite)
        run: pnpm --filter @ai-health/web build

      - name: Typecheck Mobile App (TypeScript)
        run: pnpm --filter @ai-health/mobile exec tsc --noEmit
